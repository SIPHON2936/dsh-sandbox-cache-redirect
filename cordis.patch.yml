# dsh-sandbox-cache-redirect — V6.2 sandbox cache/runtime redirection,
# guarded-provider form.
#
# Row 1 retires the native sandbox provider inside this composition: it is
# disabled, and it additionally requires the guard-ready service, so a higher
# patch layer that re-enables it still cannot activate while the guarded
# provider is unhealthy (fail closed instead of running an uncertified
# runner). The `name` field only asserts the existing plugin name.
#
# Row 2 inserts the guarded provider. Its class verifies everything (runner
# digest, install chain, binaries, composition) BEFORE registering
# ctx.sandbox, then re-verifies on every confined call. Row config is strict:
# only optional probeTimeoutMs / additionalProtectedRoots are accepted; the
# runner command is fixed inside the provider and is not configurable.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: true
  inject:
    sandboxCacheRedirectGuardReady: {}
- insert:
    - id: sandbox-cache-redirect
      name: dsh-sandbox-cache-redirect
      config: {}
