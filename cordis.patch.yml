# dsh-sandbox-cache-redirect — V6.2 sandbox cache/runtime redirection.
#
# Row 1 mounts the installer plugin (index.js): at activation it verifies the
# bundled runner's pinned SHA-256 and installs it to the trusted versioned
# location with mode 0500, refusing to overwrite differing content.
#
# Row 2 retargets the sandbox provider at that runner. `config` replaces the
# row's config wholesale (never deep-merged), so all three fields are stated.
# The !!js expression is evaluated by the Loader in the Host process and must
# stay byte-identical in effect to runnerTargetPath() in index.js.
- insert:
    - id: sandbox-cache-redirect
      name: dsh-sandbox-cache-redirect
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand: !!js "['/usr/bin/python3', '-IS', process.env.HOME + '/.local/libexec/dsh/dsh-bwrap-redirect-v6-0ef04d1a72ad']"
    runnerFailureSignatures:
      - 'dsh-bwrap-redirect:'
      - 'bwrap:'
    probeTimeoutMs: 5000
