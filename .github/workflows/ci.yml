name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static checks (tool digests, syntax, patch, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned digests of the shipped acceptance tools
        run: |
          set -euo pipefail
          cat > /tmp/pinned.sha256 <<'EOF'
          7a08612e3903c88a74da4dfabaf1e8b3f96c3511ee30b41008b942dd0ab917b2  tools/session-check.py
          4345c0772152e0634ad72af5fc16b7cb0797324c0d6328c944d448acbce77792  tools/bundle-selection.mjs
          EOF
          sha256sum --check /tmp/pinned.sha256

      - name: V7 structural invariants
        # Scope note: the retired guard service may be mentioned in docs,
        # tests and these workflows themselves (migration notes, absence
        # assertions); RUNTIME files must not reference it. Explicit exit
        # codes — a bare `! grep` does NOT fail a `set -e` step.
        run: |
          set -euo pipefail
          status=0
          if grep -rn 'sandboxCacheRedirectGuardReady' index.js lib cordis.patch.yml tools locale; then
            echo "::error::retired guard service referenced by runtime files"
            status=1
          fi
          if grep -q 'runnerCommand' cordis.patch.yml; then
            echo "::error::cordis.patch.yml carries runnerCommand"
            status=1
          fi
          for artifact in runner patches lib/install.js lib/trust.js; do
            if [ -e "$artifact" ]; then
              echo "::error::retired artifact still present: $artifact"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then echo "V7 structural invariants hold"; fi
          exit "$status"

      - name: Syntax-check the plugin sources
        run: |
          set -euo pipefail
          node --check index.js
          for f in lib/*.js tests/*.mjs tools/bundle-selection.mjs; do node --check "$f"; done
          python3 -m py_compile tools/session-check.py

      - name: Parse cordis.patch.yml (two rows, native disabled, no inject)
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          yaml.SafeLoader.add_multi_constructor(
              "tag:yaml.org,2002:js",
              lambda loader, suffix, node: loader.construct_scalar(node),
          )
          with open("cordis.patch.yml") as f:
              doc = yaml.load(f, Loader=yaml.SafeLoader)
          assert isinstance(doc, list) and len(doc) == 2, "patch must hold two rows"
          native, inserted = doc
          assert native["id"] == "sandbox"
          assert native["name"] == "@deepseek-ai/dsh-sandbox-local"
          assert native["disabled"] is True
          assert "inject" not in native, "V7 native row must not carry an inject blocker"
          assert inserted["insert"][0]["id"] == "sandbox-cache-redirect"
          assert inserted["insert"][0]["name"] == "dsh-sandbox-cache-redirect"
          assert inserted["insert"][0]["config"] == {}
          print("patch parses and matches the V7 pluggable structure")
          PY

      - name: Pack dry-run (shippable file list)
        run: npm pack --dry-run

  provider-tests:
    name: Provider test suite (Node 24, Fedora 44)
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install toolchain
        run: dnf install -y -q git bubblewrap python3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the DSH runtime (host peers anchor)
        run: npm install --global --prefix /usr/local @deepseek-ai/dsh@0.2.1-alpha.2

      - uses: actions/checkout@v4

      - name: Show environment identities
        run: |
          grep -E '^(NAME|VERSION)=' /etc/os-release
          rpm -q bubblewrap python3
          /usr/bin/python3 --version
          node --version
          dsh --version

      - name: Run the provider tests
        # V7 performs no trust-chain ownership audits, so the GHA container
        # quirks (0777 /__w checkout, runner-owned /github/home) no longer
        # matter; HOME=/root only keeps fixture mkdtemp paths simple.
        env:
          HOME: /root
          DSH_CLI: /usr/local/bin/dsh
        run: node --test tests/*.test.mjs
