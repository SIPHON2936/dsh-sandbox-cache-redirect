name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static checks (digests, syntax, patch, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned digests of the runner and acceptance tools
        run: |
          set -euo pipefail
          cat > /tmp/pinned.sha256 <<'EOF'
          0ef04d1a72ad9aa31a00e212246e8fb6765ed1948b74c654af8ce5e99b579216  runner/dsh-bwrap-redirect
          2f593b6875e272b5720cc434d73251c1bb3bd69b160fd59328f9493796e0362f  tools/smoke-v6.py
          4c3420528a92c99e4a14057f77ef7353d0334e16f0b11c0e27fbea0f8607040e  tools/session-check-v6.py
          9a2178d1660b63d7dcb812138c5e2709387cc8d1d898ba38e173f5f6980da9bb  tools/config-record.py
          EOF
          sha256sum --check /tmp/pinned.sha256

      - name: Cross-check digest constants in plugin sources
        run: |
          set -euo pipefail
          grep -q '0ef04d1a72ad9aa31a00e212246e8fb6765ed1948b74c654af8ce5e99b579216' lib/peers.js
          grep -q 'dsh-bwrap-redirect-v6-0ef04d1a72ad' lib/peers.js
          ! grep -q 'runnerCommand' cordis.patch.yml
          echo "digest constants consistent; patch carries no runner path"

      - name: Syntax-check the plugin sources
        run: |
          set -euo pipefail
          node --check index.js
          for f in lib/*.js tests/*.mjs; do node --check "$f"; done

      - name: Parse cordis.patch.yml (tolerating the loader's !!js tag)
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          yaml.SafeLoader.add_multi_constructor(
              "tag:yaml.org,2002:js",
              lambda loader, suffix, node: loader.construct_scalar(node),
          )
          with open("cordis.patch.yml") as f:
              doc = yaml.load(f, Loader=yaml.SafeLoader)
          assert isinstance(doc, list) and len(doc) == 2, "patch must hold two rows"
          native, inserted = doc
          assert native["id"] == "sandbox"
          assert native["name"] == "@deepseek-ai/dsh-sandbox-local"
          assert native["disabled"] is True
          assert "sandboxCacheRedirectGuardReady" in native["inject"]
          assert inserted["insert"][0]["id"] == "sandbox-cache-redirect"
          assert inserted["insert"][0]["name"] == "dsh-sandbox-cache-redirect"
          assert inserted["insert"][0]["config"] == {}
          print("patch parses and matches the guarded-provider structure")
          PY

      - name: Pack dry-run (shippable file list)
        run: npm pack --dry-run

  provider-tests:
    name: Guarded provider test suite (Node 24)
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install toolchain
        run: dnf install -y -q git bubblewrap python3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the pinned DSH runtime (host peers anchor)
        run: npm install --global @deepseek-ai/dsh@0.2.1-alpha.2

      - uses: actions/checkout@v4

      - name: Show environment identities
        run: |
          grep -E '^(NAME|VERSION)=' /etc/os-release
          rpm -q bubblewrap python3
          /usr/bin/python3 --version
          node --version
          dsh --version

      - name: Run the guarded provider tests from a trusted copy
        # Two GHA container quirks are accommodated at the harness level, never
        # by weakening the production audits:
        #  - HOME is forced to /github/home (owned by runner uid 1001 while the
        #    container runs as root): point HOME at root-owned /root.
        #  - the checkout lives under 0777 /__w, which the trust-chain audit
        #    rightly refuses: test a copy at /root/pkg (mirrors the plan's rule
        #    that tests run a copied package, never the linked checkout).
        env:
          HOME: /root
        run: |
          set -euo pipefail
          rm -rf /root/pkg
          cp -a "$GITHUB_WORKSPACE" /root/pkg
          cd /root/pkg
          node --test tests/*.test.mjs

  smoke:
    name: Runner smoke suite (Fedora 44, bwrap)
    runs-on: ubuntu-latest
    # bwrap needs unprivileged user namespaces, which the default container
    # confinement denies on Ubuntu hosts ("Creating new namespace failed").
    # --privileged is scoped to same-repo triggers: pull requests from forks
    # only get the static job, so untrusted code never runs privileged.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install toolchain
        run: dnf install -y -q git bubblewrap python3

      - uses: actions/checkout@v4

      - name: Show environment identities
        run: |
          grep -E '^(NAME|VERSION)=' /etc/os-release
          rpm -q bubblewrap python3
          /usr/bin/python3 --version

      - name: Run the standalone smoke suite
        run: /usr/bin/python3 -IS tools/smoke-v6.py --wrapper "$GITHUB_WORKSPACE/runner/dsh-bwrap-redirect" --parent "$RUNNER_TEMP"
