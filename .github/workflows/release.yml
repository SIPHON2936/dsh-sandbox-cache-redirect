name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  pack:
    name: Pack tarball and attach to a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned tool digests before packing
        run: |
          set -euo pipefail
          cat > /tmp/pinned.sha256 <<'EOF'
          7a08612e3903c88a74da4dfabaf1e8b3f96c3511ee30b41008b942dd0ab917b2  tools/session-check.py
          4345c0772152e0634ad72af5fc16b7cb0797324c0d6328c944d448acbce77792  tools/bundle-selection.mjs
          EOF
          sha256sum --check /tmp/pinned.sha256

      - name: npm pack and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm pack
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
